repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/
        # pre-commit installs these apart from uv.lock. Each bound is the one
        # in pyproject.toml, and tests/unit/test_dependency_bounds.py checks it.
        additional_dependencies:
          - "weaviate-client>=4.24.1,<5"
          - "httpx>=0.26.0"
          - "typer>=0.28.0"
          - "pydantic>=2.12.0"
          - "python-dotenv>=1.0.0"
          - types-PyYAML
