name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra test
      - run: uv run --no-sync pre-commit run --all-files

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra test
      - run: uv run --no-sync pytest tests/unit

  # Installs the lower bound of each direct dependency in pyproject.toml, so a
  # bound that the code does not work with fails here.
  unit-lowest:
    name: unit (lowest deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
      - run: uv venv && uv pip install --resolution lowest-direct -e ".[test]"
      - run: uv pip freeze
      - run: .venv/bin/python -m pytest tests/unit

  # Each setup is one call of acceptance.yml. The cluster setup needs a runner
  # whose CPU has AVX-512 (the first step of acceptance.yml says why), and
  # part of the ubuntu-latest pool lacks it. An attempt that runs on such a
  # runner ends in seconds with cpu-unsupported true, and the next attempt
  # runs on another runner, which the pool picks at random. GitHub Actions
  # has no retry of a job and no choice of CPU within ubuntu-latest, so the
  # attempts are a chain of jobs. An attempt that ran the tests is the last
  # one, whatever its result.
  acceptance-single:
    name: acceptance (single)
    uses: ./.github/workflows/acceptance.yml
    with: {name: single, replicas: 1, workers: 1, replication: "1", chroma: single}

  acceptance-cluster:
    name: acceptance (cluster)
    uses: ./.github/workflows/acceptance.yml
    with: {name: cluster, replicas: 3, workers: 3, replication: "3", chroma: distributed, attempt: 1, attempts: 4}

  acceptance-cluster-2:
    name: acceptance (cluster, attempt 2)
    needs: acceptance-cluster
    if: needs.acceptance-cluster.outputs.cpu-unsupported == 'true'
    uses: ./.github/workflows/acceptance.yml
    with: {name: cluster, replicas: 3, workers: 3, replication: "3", chroma: distributed, attempt: 2, attempts: 4}

  acceptance-cluster-3:
    name: acceptance (cluster, attempt 3)
    needs: acceptance-cluster-2
    if: needs.acceptance-cluster-2.outputs.cpu-unsupported == 'true'
    uses: ./.github/workflows/acceptance.yml
    with: {name: cluster, replicas: 3, workers: 3, replication: "3", chroma: distributed, attempt: 3, attempts: 4}

  acceptance-cluster-4:
    name: acceptance (cluster, attempt 4)
    needs: acceptance-cluster-3
    if: needs.acceptance-cluster-3.outputs.cpu-unsupported == 'true'
    uses: ./.github/workflows/acceptance.yml
    with: {name: cluster, replicas: 3, workers: 3, replication: "3", chroma: distributed, attempt: 4, attempts: 4}
