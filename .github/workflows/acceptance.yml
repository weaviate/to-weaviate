# One setup of the acceptance tests: Weaviate in a kind cluster through the
# weaviate-local-k8s action, a Chroma, and the suite under tests/acceptance.
# acceptance-suites.yml calls it once per setup.
name: acceptance

on:
  workflow_call:
    inputs:
      name:
        description: The name of the setup, single or cluster.
        required: true
        type: string
      replicas:
        description: Weaviate pods. The cases of test_cluster.py run when it is at least 3.
        required: true
        type: number
      workers:
        description: Worker nodes of the kind cluster.
        required: true
        type: number
      chroma:
        description: >-
          The Chroma of the setup. single is the compose container; distributed
          is the open-source distributed Chroma in the kind cluster, with
          which the seed waits for compaction and the compaction case of
          test_source_order.py runs.
        required: true
        type: string

permissions:
  contents: read
  # The cluster setup pulls two images from private packages of this
  # repository.
  packages: read

jobs:
  tests:
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEAVIATE_URL: http://localhost:8099
      WEAVIATE_GRPC_URL: http://localhost:50099
      WEAVIATE_API_KEY: admin-key
      CHROMA_URL: http://localhost:8001
      TO_WEAVIATE_REQUIRE_ACCEPTANCE: "1"
      # Every Weaviate Cloud instance runs with ASYNC_INDEXING, so both setups
      # do. Read by the tests whose outcome depends on it.
      WEAVIATE_ASYNC_INDEXING: "true"
      ACCEPTANCE_NODES: ${{ inputs.replicas }}
      ACCEPTANCE_CHROMA: ${{ inputs.chroma }}
    steps:
      # Chroma's own query-service and compactor-service images exit with
      # SIGILL on a CPU without AVX-512, which part of the ubuntu-latest pool
      # lacks. chroma-k8s.sh pins builds without it. The line shows which CPU
      # a run of the cluster setup had.
      - if: inputs.chroma == 'distributed'
        run: |
          model=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1)
          if grep -q -w avx512f /proc/cpuinfo; then flag=with; else flag=without; fi
          echo "The runner's CPU is $model, $flag avx512f."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "WEAVIATE_VERSION=$(cat tests/acceptance/weaviate-version)" >> "$GITHUB_ENV"
      # The action runs its own checkout, so it comes before any step that
      # writes to the workspace.
      - uses: weaviate/weaviate-local-k8s@d05542c6414333ad1011a5e7341b03a210754648 # v2
        with:
          weaviate-version: ${{ env.WEAVIATE_VERSION }}
          workers: ${{ inputs.workers }}
          replicas: ${{ inputs.replicas }}
          weaviate-port: 8099
          weaviate-grpc-port: 50099
          rbac: true
          modules: text2vec-transformers
          expose-pods: false
          # The chart passes each env entry to the Weaviate pods.
          values-override: |
            env:
              ASYNC_INDEXING: "true"
      # The kubectl-relay forwards of the action can stop forwarding gRPC
      # after the SIGKILL resume test; the script replaces them.
      - id: forward
        run: sh tests/acceptance/port-forward.sh
      - if: inputs.chroma == 'single'
        run: docker compose -f tests/acceptance/chroma/docker-compose.yml up -d --wait
      # chroma-k8s.sh pulls its two private images with this login.
      - if: inputs.chroma == 'distributed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Deploys distributed Chroma in the kind cluster and forwards its
      # frontend to port 8001.
      - if: inputs.chroma == 'distributed'
        run: sh tests/acceptance/chroma-k8s.sh up
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13"}
      - run: uv sync --locked --extra test && uv run --no-sync pytest tests/acceptance -v --junitxml=/tmp/acceptance-junit.xml
      # A case can record measurements as test properties, which only the XML
      # holds on a pass.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-junit-${{ inputs.name }}
          path: /tmp/acceptance-junit.xml
      # Each forward's log has a line for each start and exit of its kubectl
      # port-forward, so this step shows whether a forward died during the
      # suite and when; the gRPC forward of the action died after
      # test_resume.py killed a copy. The cluster setup also has the log of the
      # Chroma forward. A failure prints the full tails, for a test that
      # failed with exit 4.
      - if: always() && steps.forward.outcome == 'success'
        run: grep -E 'starting|exited|lost connection' /tmp/port-forward-*.log | tail -n 100
      - if: failure()
        run: tail -n 200 /tmp/port-forward-*.log
      # The restart counts, the compactor pod (an OOM kill shows there), and
      # the last log lines of each pod of five Chroma services; the previous
      # log too for a pod that restarted. The label app of each workload is
      # its name in the chart, so sts/query-service gives both of its pods.
      - if: failure() && inputs.chroma == 'distributed'
        run: |
          kubectl -n chroma get pods -o wide || true
          kubectl -n chroma describe pod -l app=compaction-service || true
          for workload in sts/compaction-service sts/rust-log-service \
            deploy/rust-frontend-service sts/query-service deploy/sysdb; do
            for pod in $(kubectl -n chroma get pods -l "app=${workload#*/}" -o name || true); do
              echo "--- $workload: kubectl -n chroma logs $pod --tail=500"
              kubectl -n chroma logs "$pod" --all-containers --tail=500 || true
              restarts=$(kubectl -n chroma get "$pod" -o jsonpath='{.status.containerStatuses[0].restartCount}' || true)
              if [ "${restarts:-0}" -gt 0 ]; then
                echo "--- $workload: kubectl -n chroma logs $pod --previous --tail=500 ($restarts restarts)"
                kubectl -n chroma logs "$pod" --all-containers --previous --tail=500 || true
              fi
            done
          done
