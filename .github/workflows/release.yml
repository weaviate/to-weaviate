name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm reads the version from the tag.
          fetch-depth: 0
          persist-credentials: false
      # A release tag must point at a commit on main. With fetch-depth 0 the
      # checkout has origin/main; the fetch covers a checkout without it.
      - run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # The wheel version must be the tag without its v. Any other version
      # stops the release before the upload.
      - run: |
          wheel="dist/to_weaviate-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::$wheel was not built. dist/ holds: $(ls dist | tr '\n' ' ')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
