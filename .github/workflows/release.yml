name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # setuptools_scm reads the version from the tag.
          fetch-depth: 0
          persist-credentials: false
      # A release tag must point at a commit on main. With fetch-depth 0 the
      # checkout has origin/main; the fetch covers a checkout without it.
      - run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install build==1.6.1
      - run: python -m build
      # The wheel version must be the tag without its v. Any other version
      # stops the release before the upload.
      - run: |
          wheel="dist/to_weaviate-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::$wheel was not built. dist/ holds: $(ls dist | tr '\n' ' ')"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Both acceptance suites on the tagged commit. The job fails unless the
  # single suite passed and "cluster result" of acceptance-suites.yml passed.
  acceptance:
    needs: build
    uses: ./.github/workflows/acceptance-suites.yml

  # No always() here or in publish: a failed, cancelled or skipped job in
  # needs skips the job, so nothing is released without both suites.
  github-release:
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # The release carries the wheel and the sdist, the exact files of the
      # version; their dependencies still come from PyPI. A release that
      # exists (made by hand, or a rerun) gets the files instead of an error.
      # --verify-tag refuses to create the tag.
      - run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Runs last: a PyPI version cannot be replaced, a GitHub release can.
  publish:
    needs: [acceptance, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
