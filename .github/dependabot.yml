version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Keeps the lower bounds of pyproject.toml. A pull request changes a
    # bound only when the new version is outside it.
    versioning-strategy: increase-if-necessary
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
