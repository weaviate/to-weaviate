name: to-weaviate-acceptance

services:
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      # Chroma here has no authentication, so only this machine reaches it.
      - "127.0.0.1:8001:8000"
    healthcheck:
      # The image has no curl, wget or nc.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 2s
      timeout: 5s
      retries: 30
