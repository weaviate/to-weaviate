[build-system]
# 77 is the first setuptools that reads the license as an SPDX expression.
requires = ["setuptools >= 77", "setuptools_scm[toml] >= 6.2", "wheel >= 0.38.1"]
build-backend = "setuptools.build_meta"

[project]
name = "to-weaviate"
dynamic = ["version"]
description = "Migrate your data to Weaviate from other vector databases"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["weaviate", "vector database", "migration", "chroma", "cli"]
# No "License ::" classifier: setuptools refuses one next to an SPDX license.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Utilities",
]
# The CI job "unit (lowest deps)" installs each lower bound and runs the unit
# tests on it.
dependencies = [
    # The code reads internals of the client, so the next major is excluded.
    "weaviate-client>=4.24.1,<5",
    "httpx>=0.26.0",
    "typer>=0.28.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[dependency-groups]
dev = ["pre-commit>=4"]

[project.scripts]
to-weaviate = "to_weaviate.cli:app"

[project.urls]
Homepage = "https://github.com/weaviate/to-weaviate"
Documentation = "https://github.com/weaviate/to-weaviate/blob/main/README.md#documentation"
Repository = "https://github.com/weaviate/to-weaviate"
Issues = "https://github.com/weaviate/to-weaviate/issues"
# The repository has no changelog file. Each GitHub release holds the notes.
Changelog = "https://github.com/weaviate/to-weaviate/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/e2e.py holds the helpers and target rules of tests/acceptance, which
# tests/unit also imports.
pythonpath = ["tests"]
addopts = ["--strict-markers"]
markers = ["infra: restarts or deletes a server through docker or kubectl; runs only where the suite owns the servers"]
filterwarnings = ["ignore::authlib.deprecate.AuthlibDeprecationWarning"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# cli.py filters a warning before its other imports, because importing
# weaviate emits that warning.
"src/to_weaviate/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
