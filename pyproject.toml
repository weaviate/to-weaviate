[build-system]
# 77 is the first setuptools that reads the license as an SPDX expression.
requires = ["setuptools >= 77", "setuptools_scm[toml] >= 6.2", "wheel >= 0.38.1"]
build-backend = "setuptools.build_meta"

[project]
name = "to-weaviate"
dynamic = ["version"]
description = "Migrate your data to Weaviate from other vector databases"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "weaviate-client>=4.24.1",
    "httpx",
    "typer>=0.28.0",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
to-weaviate = "to_weaviate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/e2e.py holds the code that tests/acceptance and tests/cloud share.
pythonpath = ["tests"]
addopts = ["--strict-markers"]
markers = ["infra: restarts or deletes a server through docker or kubectl; runs only where the suite owns the servers"]
filterwarnings = ["ignore::authlib.deprecate.AuthlibDeprecationWarning"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# cli.py filters a warning before its other imports, because importing
# weaviate emits that warning.
"src/to_weaviate/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
